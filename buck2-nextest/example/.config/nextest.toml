# Nextest configuration for the example project.
#
# `buck2-nextest` loads this from `<project-root>/.config/nextest.toml`, exactly as `cargo-nextest`
# loads it from the workspace root. Select a profile with `-P`, e.g. `-P ci`.

[profile.default]
# The example's tests all pass, so this only shows up if something is wrong.
failure-output = "immediate-final"

# A profile whose default filter narrows what a bare run covers, so that the
# tests can check both that the default filter is honoured and that
# `--ignore-default-filter` turns it back off.
[profile.narrowed]
default-filter = 'binary_id(root//:demo-lib-test)'

[profile.ci]
failure-output = "immediate-final"
fail-fast = false
retries = 2
status-level = "all"

# A profile that writes a JUnit report, so that the tests can check the store
# directory is created and the report written. The store directory is
# `target/nextest/with-junit` under the project root.
[profile.with-junit.junit]
path = "junit.xml"
