[package]
name = "nextest-session"
description = "The build-system integration pipeline for nextest."
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nextest-rs/nextest"
documentation = "https://docs.rs/nextest-session"
keywords = ["nextest", "test-runner"]
categories = ["development-tools::testing"]
edition.workspace = true
rust-version.workspace = true
exclude.workspace = true

[dependencies]
camino.workspace = true
# `guppy` is here only for `PackageId`, which names packages in the inputs an
# integration supplies.
guppy.workspace = true
iddqd.workspace = true
nextest-filtering = { version = "=0.22.0", path = "../nextest-filtering" }
nextest-metadata = { version = "=0.15.0", path = "../nextest-metadata" }
nextest-runner = { version = "=0.122.1", path = "../nextest-runner" }
nextest-workspace-hack.workspace = true
quick-junit.workspace = true
semver.workspace = true
thiserror.workspace = true
tracing.workspace = true

[lints]
workspace = true
